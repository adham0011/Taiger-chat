name: Build Xamarin Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup .NET / Xamarin
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Restore NuGet Packages
      run: nuget restore "Tiger chat.sln"

    - name: Build Android APK
      run: |
        msbuild "Tiger chat.Android/Tiger chat.Android.csproj" /t:SignAndroidPackage /p:Configuration=Release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: TigerChat-APK
        path: "**/bin/Release/*.apk"
